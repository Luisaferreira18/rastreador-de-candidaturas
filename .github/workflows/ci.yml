name: CI

on:
  push:
  pull_request:

# Um push novo na mesma branch cancela a verificação anterior, que ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores falsos, só para o build passar: ele não acessa o Supabase
      # (os dados de cada pessoa chegam na hora da requisição, por streaming).
      NEXT_PUBLIC_SUPABASE_URL: https://ci-exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_valor_falso
      NEXT_PUBLIC_SITE_URL: https://rastreador-de-candidaturas.vercel.app
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: ^2

      # Um Supabase só deste job, com as migrations do repositório. Nenhum segredo:
      # o banco de produção não é tocado. Só ficam de fora os serviços que o app não usa.
      - name: Subir o Supabase local
        run: supabase start --exclude studio,imgproxy,inbucket,edge-runtime,logflare,vector,realtime,supavisor

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      - name: Guardar o relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
